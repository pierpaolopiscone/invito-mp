<script>
(function(){
var PUB='1bNxxb7UrNCLNHh3C4x57mI7bjHuQpoA5ooB--US5wmk';
var FORM='https://docs.google.com/forms/d/e/1FAIpQLSeS_Le8BGtgrwE_kmS0AkCC1_3SnyGguYSb6-6WnHF7Hd8NeQ/formResponse';
var E={codice:'entry.407281430',da:'entry.2050955296',dati:'entry.1296441758'};
var P=new URLSearchParams(location.search),C=P.get('c'),F=P.get('f'),T=P.get('t')==='1';
var app=document.getElementById('app');
var D=null,me=null,draft={};
var TXT='Ciao! Domenica 27 dicembre 2026 alle 10:00 battezziamo Michele Pio nella Parrocchia Santissima Trinità (Via Dante Alighieri, Manfredonia). Dopo la cerimonia festeggiamo insieme da Manfredi Ricevimenti (S.P. 58, km 12, Manfredonia). Ci farebbe tanto piacere avervi con noi: fateci sapere entro il 13 dicembre. Un abbraccio, Pierpaolo e Mariassunta';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nome(n){return String(n).replace(/^Zi[oa] /,'')}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}

var KEY='mp-chi-'+C;
var n=0;
function leggiFam(cb){

  window[name]=function(r){done=true;delete window[name];s.remove();
    if(!r||r.status!=='ok'){cb({ok:false,error:'rete'});return}

    rows.forEach(function(row){var c=row.c.map(function(x){return x&&x.v!=null?String(x.v):''});if(c[0]===C)m.push({id:c[1],nome:c[2],eta:c[3],stato:c[4]||'attesa',da:c[5],allergie:localAl(c[1])})});
    cb(m.length?{ok:true,membri:m}:{ok:false,error:'non_trovato'})};
  var q="select A,B,C,D,E,F where A='"+C.replace(/[^a-z0-9]/gi,'')+"'";

  setTimeout(function(){if(!done){done=true;cb({ok:false,error:'rete'})}},20000);
}
function localAl(id){return load('mp-al-'+C+'-'+id)||''}

  var body=new URLSearchParams();body.append(E.codice,C);body.append(E.da,me);body.append(E.dati,JSON.stringify(dati));
  fetch(FORM,{method:'POST',mode:'no-cors',body:body}).then(function(){
    dati.forEach(function(x){var m=byId(x.id);if(!m)return;m.stato=x.stato;m.da=x.stato==='attesa'?'':byId(me).nome;if(x.allergie!=null&&x.allergie!==''){var al=/^nessun/i.test(x.allergie)?'':x.allergie;m.allergie=al;store('mp-al-'+C+'-'+x.id,al)}if(x.stato==='no'){m.allergie='';store('mp-al-'+C+'-'+x.id,null)}});

var INFO='<div class="card info"><h2>Il giorno</h2><p><b><span class="nw">Domenica 27 dicembre 2026</span>, <span class="nw">ore 10:00</span></b></p><p><b>Cerimonia</b><br>Parrocchia Santissima Trinità<br>Via Dante Alighieri, Manfredonia<br><a href="https://waze.com/ul?q='+encodeURIComponent('Parrocchia Santissima Trinità, Via Dante Alighieri, Manfredonia')+'&navigate=yes">Waze</a> &nbsp;·&nbsp; <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Parrocchia Santissima Trinità, Via Dante Alighieri, Manfredonia')+'">Maps</a></p><p><b>Pranzo</b><br>Manfredi Ricevimenti<br>S.P. 58, km 12, Manfredonia<br><a href="https://waze.com/ul?q='+encodeURIComponent('Manfredi Ricevimenti, Manfredonia')+'&navigate=yes">Waze</a> &nbsp;·&nbsp; <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Manfredi Ricevimenti, Manfredonia')+'">Maps</a></p></div>';
function shell(inner,small){app.innerHTML='<img class="inv'+(small?' small':'')+'" src="invito.jpg" alt="Invito al battesimo di Michele Pio" role="button" tabindex="0"><span class="hint">Tocca l\'invito per vederlo grande</span>'+inner}
function stLab(s,eta){return s==='si'?'Ci sarà':s==='no'?'Non ci sarà':'Non ha ancora risposto'}
function byId(id){for(var i=0;i<D.membri.length;i++)if(D.membri[i].id===id)return D.membri[i];return null}

/* ---- modalità foto (per Pierpaolo) ---- */
function fotoMode(){
  shell('<h1>'+(F?'Invito per '+esc(F):'Condividi l\'invito')+'</h1><p class="soft center">Tocca il pulsante e scegli WhatsApp</p><button class="btn primary" id="sh">Condividi l\'invito</button><p class="soft center" id="msg"></p>');
  document.getElementById('sh').onclick=function(){
    fetch('invito.jpg').then(function(r){return r.blob()}).then(function(b){
      var f=new File([b],'Invito battesimo Michele Pio.jpg',{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share(T?{files:[f],text:TXT}:{files:[f]});
      var a=document.createElement('a');a.href='invito.jpg';a.download=f.name;a.click();document.getElementById('msg').textContent='Questo browser non condivide immagini: l\'ho scaricata.';
    }).catch(function(e){if(e&&e.name!=='AbortError')document.getElementById('msg').textContent='Non è riuscito: tieni premuta l\'immagine e scegli Condividi.'});
  };
}

/* ---- conferma presenza ---- */
function start(){
  shell('<div class="spin"></div>');
  leggiFam(function(d){
    if(!d.ok){shell('<div class="card center"><p class="err">'+(d.error==='non_trovato'?'Questo link non è valido.':'Non riesco a caricare l\'invito in questo momento.')+'</p><p class="soft">'+(d.error==='non_trovato'?'Chiedi a Pierpaolo o Mariassunta il link giusto.':'Controlla la connessione e riprova.')+'</p><button class="btn" onclick="location.reload()">Riprova</button></div>'+INFO);return}
    try{var rec=JSON.parse(load('mp-agg-'+C)||'[]');rec.forEach(function(p){var mm=null;d.membri.forEach(function(x){if(x.id===p[0])mm=x});if(mm&&mm.stato==='attesa')mm.stato=p[1]})}catch(e){}
    D=d;var saved=load(KEY);me=saved&&byId(saved)?saved:null;
    if(D.membri.length===1)me=D.membri[0].id;
    if(!me)return chi();
    var m=byId(me);
    if(m.stato==='attesa')return domanda();
    riepilogo();
  });
}
function chi(){
  shell('<div class="card"><h2 class="center">Ciao!</h2><p class="lead">Vi aspettiamo al battesimo di</p><span class="nome">Michele Pio</span><p><b>Chi sei?</b> Tocca il tuo nome.</p><div class="who">'+D.membri.map(function(m){return '<button class="btn" data-id="'+esc(m.id)+'">'+esc(m.nome)+'</button>'}).join('')+'</div></div>'+INFO,true);
  app.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){me=b.getAttribute('data-id');store(KEY,me);var m=byId(me);if(m.stato==='attesa')domanda();else riepilogo()}});
}
function domanda(){
  var m=byId(me);draft={};
  shell('<div class="card center"><h2>Ciao '+esc(nome(m.nome))+'!</h2><p class="lead">Ci sarai al battesimo di</p><span class="nome">Michele Pio</span><p class="soft"><span class="nw">Domenica 27 dicembre</span>, <span class="nw">ore 10:00</span></p><button class="btn primary" id="si">Sì, ci sarò</button><button class="btn no" id="no">No, purtroppo non posso</button>'+(D.membri.length>1?'<button class="btn link" id="altro">Non sono '+esc(nome(m.nome))+'</button>':'')+'</div>'+INFO,true);
  document.getElementById('si').onclick=function(){draft[me]='si';altri()};
  document.getElementById('no').onclick=function(){draft[me]='no';altri()};
  var a=document.getElementById('altro');if(a)a.onclick=function(){store(KEY,null);me=null;chi()};
}
function perAltri(){return D.membri.filter(function(x){return x.id!==me&&(x.stato==='attesa'||!x.da||x.da!==x.nome)})}
function altri(onlyOthers){
  var lista=perAltri().filter(function(x){return !(x.id in draft)});
  if(!lista.length)return allergie();
  var sel={};lista.forEach(function(x){sel[x.id]=x.stato==='attesa'?(draft[me]||'si'):x.stato});
  shell('<div class="card"><h2>'+(onlyOthers?'Rispondi per gli altri':'Rispondi anche per loro?')+'</h2><p class="soft">Puoi rispondere per chi non l’ha ancora fatto, o cambiare una risposta data da qualcun altro. Se non lo sai, scegli “Risponde da sé”.</p>'+lista.map(function(x){var gia=x.stato!=='attesa';return '<div class="person"><label>'+esc(x.nome)+'</label>'+(gia?'<p class="soft" style="margin-top:-2px">'+(x.da?'Ha risposto '+esc(nome(x.da))+': ':'')+(x.stato==='si'?'ci sarà':'non ci sarà')+'</p>':'')+'<div class="seg" data-p="'+esc(x.id)+'"><button data-v="si" aria-pressed="'+(sel[x.id]==='si')+'">Ci sarà</button><button class="no" data-v="no" aria-pressed="'+(sel[x.id]==='no')+'">Non ci sarà</button><button data-v="'+(gia?'attesa':'')+'" aria-pressed="false">Risponde da sé</button></div></div>'}).join('')+'<button class="btn primary" id="go">Avanti</button></div>',true);
  app.querySelectorAll('[data-p]').forEach(function(s){s.querySelectorAll('button').forEach(function(b){b.onclick=function(){s.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});sel[s.getAttribute('data-p')]=b.getAttribute('data-v')}})});
  document.getElementById('go').onclick=function(){lista.forEach(function(x){if(sel[x.id])draft[x.id]=sel[x.id]});allergie()};
}
function stato(x){return x.id in draft?draft[x.id]:x.stato}
function allergie(onlyAl){
  var vengono=D.membri.filter(function(x){return stato(x)==='si'});
  if(!vengono.length)return invia({});
  shell('<div class="card"><h2>Allergie o intolleranze?</h2><p class="soft">Per il pranzo. Se non ce ne sono, scrivi “nessuna”.</p>'+vengono.map(function(x){return '<div class="person"><label for="a-'+esc(x.id)+'">'+esc(x.nome)+'</label><input type="text" id="a-'+esc(x.id)+'" data-a="'+esc(x.id)+'" value="'+esc(x.allergie)+'" placeholder="Nessuna"></div>'}).join('')+'<button class="btn primary" id="ok">'+(onlyAl?'Salva':'Conferma')+'</button><button class="btn link" id="indietro">Indietro</button></div>',true);
  document.getElementById('indietro').onclick=function(){onlyAl?riepilogo():domanda()};
  document.getElementById('ok').onclick=function(){var al={};app.querySelectorAll('[data-a]').forEach(function(i){al[i.getAttribute('data-a')]=i.value.trim().slice(0,200)});invia(al)};
}
function invia(al){
  var dati=[];D.membri.forEach(function(x){var s=stato(x);if((x.id in draft)||(x.id in al))dati.push({id:x.id,stato:s,allergie:(x.id in al)?al[x.id]:(s==='no'?'':x.allergie)})});

  salvaFam(dati,function(d){
    if(!d.ok){shell('<div class="card center"><p class="err">Non sono riuscito a salvare la risposta.</p><p class="soft">Controlla la connessione e riprova.</p><button class="btn primary" id="rt">Riprova</button></div>',true);document.getElementById('rt').onclick=function(){invia(al)};return}
    draft={};riepilogo(true);

function riepilogo(appena){
  var m=byId(me),mancano=perAltri().length,vengono=D.membri.some(function(x){return x.stato==='si'});
  var tit=m.stato==='si'?'Grazie '+esc(nome(m.nome))+', ti aspettiamo!':m.stato==='no'?'Grazie per averci fatto sapere, '+esc(nome(m.nome))+'.':'Ciao '+esc(nome(m.nome))+'!';
  shell('<div class="card"><h2>'+tit+'</h2>'+(appena?'<p class="soft">La risposta è arrivata a Pierpaolo e Mariassunta.</p>':'<p class="soft">Ecco le risposte della vostra famiglia.</p>')+
  D.membri.map(function(x){return '<div class="row"><span class="n">'+esc(x.nome)+(x.allergie&&x.stato==='si'?'<br><span class="al">'+esc(x.allergie)+'</span>':'')+'</span><span class="st '+esc(x.stato)+'">'+stLab(x.stato)+'</span></div>'}).join('')+
  '<button class="btn primary" id="mod">Cambia la mia risposta</button>'+(vengono?'<button class="btn" id="al">Allergie e intolleranze</button>':'')+(mancano?'<button class="btn" id="alt">Rispondi per gli altri</button>':'')+(D.membri.length>1?'<button class="btn link" id="chi">Non sono '+esc(nome(m.nome))+'</button>':'')+'</div>'+INFO,true);
  document.getElementById('mod').onclick=function(){draft={};var mm=byId(me);shell('<div class="card center"><h2>Cambia risposta</h2><p>Ci sarai al battesimo di <span class="nw">Michele Pio</span>?</p><button class="btn primary" id="si">Sì, ci sarò</button><button class="btn no" id="no">No, non posso</button><button class="btn link" id="ann">Annulla</button></div>',true);
    document.getElementById('si').onclick=function(){draft[me]='si';altri()};document.getElementById('no').onclick=function(){draft[me]='no';altri()};document.getElementById('ann').onclick=function(){riepilogo()}};
  var b=document.getElementById('al');if(b)b.onclick=function(){draft={};allergie(true)};

/* ---- invito a schermo intero, con zoom ---- */
var Z=document.createElement('div');Z.id='zoom';Z.setAttribute('role','dialog');Z.setAttribute('aria-label','Invito a schermo intero');
Z.innerHTML='<button class="x" type="button">Chiudi ✕</button><img src="invito.jpg" alt="Invito al battesimo di Michele Pio"><p class="tip">Allarga con due dita per ingrandire</p>';
document.body.appendChild(Z);
var zi=Z.querySelector('img'),zs=1,zx=0,zy=0,w0=0,h0=0,pts={},g0=null,lastTap=0;
function fit(){var vw=innerWidth,vh=innerHeight,r=Math.min(vw/720,vh/1280);w0=720*r;h0=1280*r;zi.style.width=w0+'px';zi.style.height=h0+'px';zi.style.left='0';zi.style.top='0';zi.style.maxWidth='none';zi.style.maxHeight='none'}
function clamp(){var vw=innerWidth,vh=innerHeight,w=w0*zs,h=h0*zs;
  zx=w<=vw?(vw-w)/2:Math.min(0,Math.max(vw-w,zx));zy=h<=vh?(vh-h)/2:Math.min(0,Math.max(vh-h,zy))}
function draw(){clamp();zi.style.transform='translate('+zx+'px,'+zy+'px) scale('+zs+')'}
function zoomAt(ns,cx,cy){ns=Math.max(1,Math.min(5,ns));var px=(cx-zx)/zs,py=(cy-zy)/zs;zs=ns;zx=cx-px*zs;zy=cy-py*zs;draw()}
function apri(){fit();zs=1;zx=0;zy=0;draw();Z.classList.add('on');document.body.style.overflow='hidden';try{history.pushState({zoom:1},'')}catch(e){}}
function chiudi(fromPop){if(!Z.classList.contains('on'))return;Z.classList.remove('on');document.body.style.overflow='';if(!fromPop){try{if(history.state&&history.state.zoom)history.back()}catch(e){}}}

addEventListener('resize',function(){if(Z.classList.contains('on')){fit();draw()}});
