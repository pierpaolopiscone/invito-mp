<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Battesimo di Michele Pio</title>
<meta property="og:type" content="website"><meta property="og:title" content="Battesimo di Michele Pio"><meta property="og:description" content="Domenica 27 dicembre 2026, ore 10:00 · Tocca per confermare la vostra presenza"><meta property="og:image" content="https://pierpaolopiscone.github.io/invito-mp/invito.jpg"><meta property="og:image:type" content="image/jpeg"><meta property="og:image:width" content="720"><meta property="og:image:height" content="1280">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Great+Vibes&family=Nunito+Sans:wght@400;700&display=swap">
<style>
:root{--bg:#FBF6EC;--card:#FFFDF8;--ink:#2C3F36;--soft:#6A7D72;--line:#E7DDC9;--euc:#557A66;--sage:#DDE7DF;--holly:#A2443C;--hollys:#F5E1DC;--gold:#A9864B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Nunito Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:18px 16px 48px}
.inv{display:block;width:100%;border-radius:18px;box-shadow:0 18px 38px -18px rgba(60,40,20,.5),0 0 0 1px var(--line);background:#fff}
.inv.small{width:62%;margin:0 auto}
h1{font:600 30px/1.1 "Cormorant Garamond",serif;margin:18px 0 6px;text-align:center}
h2{font:600 24px/1.15 "Cormorant Garamond",serif;margin:0 0 6px}
.script{font:400 40px/1 "Great Vibes",cursive;color:var(--euc)}
p{margin:6px 0}.soft{color:var(--soft);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:16px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 17px "Nunito Sans",sans-serif;margin-top:10px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--euc);border-color:var(--euc);color:#fff}
.btn.no{color:var(--holly);border-color:var(--hollys)}
.btn.link{border:0;background:none;color:var(--euc);min-height:44px;text-decoration:underline}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.who .btn{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{flex:1;font-weight:700}
.st{font-size:14px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.st.si{background:var(--sage);color:var(--euc)}.st.no{background:var(--hollys);color:var(--holly)}.st.attesa{background:#F4EAD5;color:var(--gold)}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:700 15px "Nunito Sans",sans-serif;color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--euc);border-color:var(--euc);color:#fff}
.seg button.no[aria-pressed=true]{background:var(--holly);border-color:var(--holly)}
.person{padding:12px 0;border-top:1px solid var(--line)}.person:first-of-type{border-top:0}
label{display:block;font-weight:700;margin-bottom:6px}
input[type=text]{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font:16px "Nunito Sans",sans-serif;background:#fff;color:var(--ink)}
.al{font-size:14px;color:var(--holly)}
.info{display:grid;gap:4px;font-size:15px}
.info a{color:var(--euc);font-weight:700}
.center{text-align:center}
.err{color:var(--holly);font-weight:700}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--euc);border-radius:50%;margin:24px auto;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(1turn)}}
</style></head><body><div class="wrap" id="app"><img class="inv" src="invito.jpg" alt="Invito al battesimo di Michele Pio"><div class="spin"></div></div>
<script>
(function(){
var PUB='1bNxxb7UrNCLNHh3C4x57mI7bjHuQpoA5ooB--US5wmk';
var FORM='https://docs.google.com/forms/d/e/1FAIpQLSeS_Le8BGtgrwE_kmS0AkCC1_3SnyGguYSb6-6WnHF7Hd8NeQ/formResponse';
var E={codice:'entry.407281430',da:'entry.2050955296',dati:'entry.1296441758'};
var P=new URLSearchParams(location.search),C=P.get('c'),F=P.get('f'),T=P.get('t')==='1';
var app=document.getElementById('app');
var D=null,me=null,draft={};
var TXT='Siamo felici di invitarvi al Battesimo di Michele Pio, domenica 27 dicembre 2026 alle 10:00 nella Parrocchia Santissima Trinità (Via Dante Alighieri, Manfredonia). Dopo la cerimonia festeggeremo insieme da Manfredi Ricevimenti (S.P. 58, km 12 – Manfredonia). Vi chiediamo gentilmente di confermare entro il 13 dicembre. Un abbraccio, Pierpaolo e Mariassunta';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function nome(n){return String(n).replace(/^Zi[oa] /,'')}
function store(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
var KEY='mp-chi-'+C;
var n=0;
function leggiFam(cb){
  var name='__g'+(++n)+Date.now(),s=document.createElement('script'),done=false;
  window[name]=function(r){done=true;delete window[name];s.remove();
    if(!r||r.status!=='ok'){cb({ok:false,error:'rete'});return}
    var rows=(r.table&&r.table.rows)||[],m=[];
    rows.forEach(function(row){var c=row.c.map(function(x){return x&&x.v!=null?String(x.v):''});if(c[0]===C)m.push({id:c[1],nome:c[2],eta:c[3],stato:c[4]||'attesa',da:c[5],allergie:localAl(c[1])})});
    cb(m.length?{ok:true,membri:m}:{ok:false,error:'non_trovato'})};
  var q="select A,B,C,D,E,F where A='"+C.replace(/[^a-z0-9]/gi,'')+"'";
  s.src='https://docs.google.com/spreadsheets/d/'+PUB+'/gviz/tq?headers=1&tqx=responseHandler:'+name+'&tq='+encodeURIComponent(q)+'&_='+Date.now();
  s.onerror=function(){if(!done){done=true;cb({ok:false,error:'rete'})}};
  document.head.appendChild(s);
  setTimeout(function(){if(!done){done=true;cb({ok:false,error:'rete'})}},20000);
}
function localAl(id){return load('mp-al-'+C+'-'+id)||''}
function salvaFam(dati,cb){
  var body=new URLSearchParams();body.append(E.codice,C);body.append(E.da,me);body.append(E.dati,JSON.stringify(dati));
  fetch(FORM,{method:'POST',mode:'no-cors',body:body}).then(function(){
    dati.forEach(function(x){var m=byId(x.id);if(!m)return;m.stato=x.stato;m.da=me;if(x.allergie!=null&&x.allergie!==''){var al=/^nessun/i.test(x.allergie)?'':x.allergie;m.allergie=al;store('mp-al-'+C+'-'+x.id,al)}if(x.stato==='no'){m.allergie='';store('mp-al-'+C+'-'+x.id,null)}});
    store('mp-agg-'+C,JSON.stringify(D.membri.map(function(m){return[m.id,m.stato]})));
    cb({ok:true});
  }).catch(function(){cb({ok:false})});
}
var INFO='<div class="card info"><h2>Il giorno</h2><p><b>Domenica 27 dicembre 2026, ore 10:00</b></p><p>Parrocchia Santissima Trinità, Via Dante Alighieri, Manfredonia · <a href="https://waze.com/ul?q='+encodeURIComponent('Parrocchia Santissima Trinità, Via Dante Alighieri, Manfredonia')+'&navigate=yes">Waze</a> · <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Parrocchia Santissima Trinità, Via Dante Alighieri, Manfredonia')+'">Maps</a></p><p>Pranzo da Manfredi Ricevimenti, S.P. 58 km 12, Manfredonia · <a href="https://waze.com/ul?q='+encodeURIComponent('Manfredi Ricevimenti, Manfredonia')+'&navigate=yes">Waze</a> · <a href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Manfredi Ricevimenti, Manfredonia')+'">Maps</a></p></div>';
function shell(inner,small){app.innerHTML='<img class="inv'+(small?' small':'')+'" src="invito.jpg" alt="Invito al battesimo di Michele Pio">'+inner}
function stLab(s,eta){return s==='si'?'Ci sarà':s==='no'?'Non ci sarà':'Non ha ancora risposto'}
function byId(id){for(var i=0;i<D.membri.length;i++)if(D.membri[i].id===id)return D.membri[i];return null}

/* ---- modalità foto (per Pierpaolo) ---- */
function fotoMode(){
  shell('<h1>'+(F?'Invito per '+esc(F):'Condividi l\'invito')+'</h1><p class="soft center">Tocca il pulsante e scegli WhatsApp</p><button class="btn primary" id="sh">Condividi l\'invito</button><p class="soft center" id="msg"></p>');
  document.getElementById('sh').onclick=function(){
    fetch('invito.jpg').then(function(r){return r.blob()}).then(function(b){
      var f=new File([b],'Invito battesimo Michele Pio.jpg',{type:'image/jpeg'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))return navigator.share(T?{files:[f],text:TXT}:{files:[f]});
      var a=document.createElement('a');a.href='invito.jpg';a.download=f.name;a.click();document.getElementById('msg').textContent='Questo browser non condivide immagini: l\'ho scaricata.';
    }).catch(function(e){if(e&&e.name!=='AbortError')document.getElementById('msg').textContent='Non è riuscito: tieni premuta l\'immagine e scegli Condividi.'});
  };
}

/* ---- conferma presenza ---- */
function start(){
  shell('<div class="spin"></div>');
  leggiFam(function(d){
    if(!d.ok){shell('<div class="card center"><p class="err">'+(d.error==='non_trovato'?'Questo link non è valido.':'Non riesco a caricare l\'invito in questo momento.')+'</p><p class="soft">'+(d.error==='non_trovato'?'Chiedi a Pierpaolo o Mariassunta il link giusto.':'Controlla la connessione e riprova.')+'</p><button class="btn" onclick="location.reload()">Riprova</button></div>'+INFO);return}
    try{var rec=JSON.parse(load('mp-agg-'+C)||'[]');rec.forEach(function(p){var mm=null;d.membri.forEach(function(x){if(x.id===p[0])mm=x});if(mm&&mm.stato==='attesa')mm.stato=p[1]})}catch(e){}
    D=d;var saved=load(KEY);me=saved&&byId(saved)?saved:null;
    if(D.membri.length===1)me=D.membri[0].id;
    if(!me)return chi();
    var m=byId(me);
    if(m.stato==='attesa')return domanda();
    riepilogo();
  });
}
function chi(){
  shell('<div class="card"><h2>Ciao!</h2><p>Siamo felici di invitarvi al battesimo di <span class="script">Michele Pio</span>.</p><p><b>Chi sei?</b></p><div class="who">'+D.membri.map(function(m){return '<button class="btn" data-id="'+esc(m.id)+'">'+esc(m.nome)+'</button>'}).join('')+'</div></div>'+INFO,true);
  app.querySelectorAll('[data-id]').forEach(function(b){b.onclick=function(){me=b.getAttribute('data-id');store(KEY,me);var m=byId(me);if(m.stato==='attesa')domanda();else riepilogo()}});
}
function domanda(){
  var m=byId(me);draft={};
  shell('<div class="card center"><h2>Ciao '+esc(nome(m.nome))+'!</h2><p>Ci sarai al battesimo di <span class="script">Michele Pio</span>?</p><p class="soft">Domenica 27 dicembre, ore 10:00</p><button class="btn primary" id="si">Sì, ci sarò</button><button class="btn no" id="no">No, purtroppo non posso</button>'+(D.membri.length>1?'<button class="btn link" id="altro">Non sono '+esc(nome(m.nome))+'</button>':'')+'</div>'+INFO,true);
  document.getElementById('si').onclick=function(){draft[me]='si';altri()};
  document.getElementById('no').onclick=function(){draft[me]='no';altri()};
  var a=document.getElementById('altro');if(a)a.onclick=function(){store(KEY,null);me=null;chi()};
}
function altri(onlyOthers){
  var lista=D.membri.filter(function(x){return x.id!==me&&x.stato==='attesa'&&!(x.id in draft)});
  if(!lista.length)return allergie();
  var sel={};lista.forEach(function(x){sel[x.id]=draft[me]||'si'});
  shell('<div class="card"><h2>'+(onlyOthers?'Rispondi per chi manca':'Rispondi anche per loro?')+'</h2><p class="soft">Non hanno ancora risposto. Se non sai, lascia “Risponde da sé”.</p>'+lista.map(function(x){return '<div class="person"><label>'+esc(x.nome)+'</label><div class="seg" data-p="'+esc(x.id)+'"><button data-v="si" aria-pressed="'+(sel[x.id]==='si')+'">Ci sarà</button><button class="no" data-v="no" aria-pressed="'+(sel[x.id]==='no')+'">Non ci sarà</button><button data-v="" aria-pressed="false">Risponde da sé</button></div></div>'}).join('')+'<button class="btn primary" id="go">Avanti</button></div>',true);
  app.querySelectorAll('[data-p]').forEach(function(s){s.querySelectorAll('button').forEach(function(b){b.onclick=function(){s.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});sel[s.getAttribute('data-p')]=b.getAttribute('data-v')}})});
  document.getElementById('go').onclick=function(){lista.forEach(function(x){if(sel[x.id])draft[x.id]=sel[x.id]});allergie()};
}
function stato(x){return x.id in draft?draft[x.id]:x.stato}
function allergie(onlyAl){
  var vengono=D.membri.filter(function(x){return stato(x)==='si'});
  if(!vengono.length)return invia({});
  shell('<div class="card"><h2>Allergie o intolleranze?</h2><p class="soft">Per il pranzo. Se non ce ne sono, scrivi “nessuna”.</p>'+vengono.map(function(x){return '<div class="person"><label for="a-'+esc(x.id)+'">'+esc(x.nome)+'</label><input type="text" id="a-'+esc(x.id)+'" data-a="'+esc(x.id)+'" value="'+esc(x.allergie)+'" placeholder="Nessuna"></div>'}).join('')+'<button class="btn primary" id="ok">'+(onlyAl?'Salva':'Conferma')+'</button><button class="btn link" id="indietro">Indietro</button></div>',true);
  document.getElementById('indietro').onclick=function(){onlyAl?riepilogo():domanda()};
  document.getElementById('ok').onclick=function(){var al={};app.querySelectorAll('[data-a]').forEach(function(i){al[i.getAttribute('data-a')]=i.value.trim().slice(0,200)});invia(al)};
}
function invia(al){
  var dati=[];D.membri.forEach(function(x){var s=stato(x);if((x.id in draft)||(x.id in al))dati.push({id:x.id,stato:s,allergie:(x.id in al)?al[x.id]:(s==='no'?'':x.allergie)})});
  if(!dati.length)return riepilogo();
  shell('<div class="spin"></div><p class="center soft">Invio in corso…</p>',true);
  salvaFam(dati,function(d){
    if(!d.ok){shell('<div class="card center"><p class="err">Non sono riuscito a salvare la risposta.</p><p class="soft">Controlla la connessione e riprova.</p><button class="btn primary" id="rt">Riprova</button></div>',true);document.getElementById('rt').onclick=function(){invia(al)};return}
    draft={};riepilogo(true);
  });
}
function riepilogo(appena){
  var m=byId(me),mancano=D.membri.filter(function(x){return x.stato==='attesa'}).length,vengono=D.membri.some(function(x){return x.stato==='si'});
  var tit=m.stato==='si'?'Grazie '+esc(nome(m.nome))+', ti aspettiamo!':m.stato==='no'?'Grazie per averci fatto sapere, '+esc(nome(m.nome))+'.':'Ciao '+esc(nome(m.nome))+'!';
  shell('<div class="card"><h2>'+tit+'</h2>'+(appena?'<p class="soft">La risposta è arrivata a Pierpaolo e Mariassunta.</p>':'<p class="soft">Ecco le risposte della vostra famiglia.</p>')+
  D.membri.map(function(x){return '<div class="row"><span class="n">'+esc(x.nome)+(x.allergie&&x.stato==='si'?'<br><span class="al">'+esc(x.allergie)+'</span>':'')+'</span><span class="st '+esc(x.stato)+'">'+stLab(x.stato)+'</span></div>'}).join('')+
  '<button class="btn primary" id="mod">Cambia la mia risposta</button>'+(vengono?'<button class="btn" id="al">Allergie e intolleranze</button>':'')+(mancano?'<button class="btn" id="alt">Rispondi per chi manca</button>':'')+(D.membri.length>1?'<button class="btn link" id="chi">Non sono '+esc(nome(m.nome))+'</button>':'')+'</div>'+INFO,true);
  document.getElementById('mod').onclick=function(){draft={};var mm=byId(me);shell('<div class="card center"><h2>Cambia risposta</h2><p>Ci sarai al battesimo?</p><button class="btn primary" id="si">Sì, ci sarò</button><button class="btn no" id="no">No, non posso</button><button class="btn link" id="ann">Annulla</button></div>',true);
    document.getElementById('si').onclick=function(){draft[me]='si';allergie()};document.getElementById('no').onclick=function(){draft[me]='no';invia({})};document.getElementById('ann').onclick=function(){riepilogo()}};
  var b=document.getElementById('al');if(b)b.onclick=function(){draft={};allergie(true)};
  b=document.getElementById('alt');if(b)b.onclick=function(){draft={};altri(true)};
  b=document.getElementById('chi');if(b)b.onclick=function(){store(KEY,null);me=null;chi()};
}
if(C)start();else fotoMode();
})();
</script></body></html>
